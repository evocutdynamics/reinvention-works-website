[build]
  publish = "."
  command = "python3 _migration/go_live.py --ci"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/your-first-move.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Disposition = "inline; filename=\"Your-First-Move-Reinvention-Works.pdf\""

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/blog"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/feed"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/resources/page/*"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/author/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/comments/feed/*"
  to = "/resources/"
  status = 301

[[redirects]]
