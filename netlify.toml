[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/blog"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/reset"
  to = "/programs/#reset"
  status = 301

[[redirects]]
  from = "/reset/"
  to = "/programs/#reset"
  status = 301

[[redirects]]
  from = "/discovery-call"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/referral-partnership"
  to = "/organizations/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404